```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: sans-serif;
      background: #fff;
      color: #111;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    /* 左側の画像 */
    .icon {
      width: 120px;
      height: 120px;

      border-radius: 50%;
      object-fit: cover;
    }

    /* 右側の文字 */
    .text {
      font-size: 24px;
    }
  </style>
</head>

<body>

  <div class="profile">

    <img
      class="icon"
      src="icon.png"
      alt=""
    >

    <div class="text">
      しりとる
    </div>

  </div>

</body>
</html>
```
